name: "fidelity test"


on:
  pull_request:
    branches:
        - "main"

permissions:
  pull-requests: write
  contents: write

jobs:
  crosscheck:
    runs-on: "ubuntu-22.04"
    defaults:
      run:
        working-directory: weir
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ocaml:
              - 'weir/**'
      - if: steps.filter.outputs.ocaml == 'true'
        uses: ocaml/setup-ocaml@v3.7.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
      - if: steps.filter.outputs.ocaml == 'true'
        run: opam install . --deps-only --with-test
      - if: steps.filter.outputs.ocaml == 'true'
        run: opam exec -- dune build
      - if: steps.filter.outputs.ocaml == 'true'
        id: crosscheck
        run: |
          regressed=0
          grep '^#' reference/crosscheck_baseline.txt > /tmp/new_baseline.txt
          : > /tmp/comment_rows.txt
          { grep -v '^#' reference/crosscheck_baseline.txt | awk '{print $1}'; \
            find reference/test_plans -name plan.json | sort; } \
            | sort -u > /tmp/all_plans.txt
          while read -r plan; do
            [ -z "$plan" ] && continue
            baseline=$(grep -v '^#' reference/crosscheck_baseline.txt \
              | awk -v p="$plan" '$1 == p { print $2 }')
            n=$(opam exec -- dune exec reference/bin/crosscheck_run.exe -- "$plan" \
              | tail -1 | grep -oE '[0-9]+ disagree' | grep -oE '^[0-9]+')
            if [ -z "$baseline" ]; then
              echo "$plan: $n disagreement(s) (new plan, baseline set to $n)"
              echo "- \`$plan\`: $n disagreement(s) (new plan, baseline set to $n)" >> /tmp/comment_rows.txt
              echo "$plan $n" >> /tmp/new_baseline.txt
              continue
            fi
            echo "$plan: $n disagreement(s) (baseline: $baseline)"
            echo "- \`$plan\`: $n disagreement(s) (baseline: $baseline)" >> /tmp/comment_rows.txt
            if [ "$n" -gt "$baseline" ]; then
              echo "::error::crosscheck regressed for $plan: $n disagreements, baseline is $baseline"
              regressed=1
              echo "$plan $baseline" >> /tmp/new_baseline.txt
            elif [ "$n" -lt "$baseline" ]; then
              echo "$plan $n" >> /tmp/new_baseline.txt
            else
              echo "$plan $baseline" >> /tmp/new_baseline.txt
            fi
          done < /tmp/all_plans.txt
          if diff -q /tmp/new_baseline.txt reference/crosscheck_baseline.txt > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/comment_rows.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ "$regressed" -eq 1 ]; then
            exit 1
          fi
      - if: steps.filter.outputs.ocaml == 'true' && steps.crosscheck.outputs.changed == 'true'
        run: |
          cp /tmp/new_baseline.txt reference/crosscheck_baseline.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reference/crosscheck_baseline.txt
          git commit -m "update crosscheck baseline"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
      - if: always() && steps.filter.outputs.ocaml == 'true'
        uses: actions/github-script@v7
        env:
          CROSSCHECK_BODY: ${{ steps.crosscheck.outputs.body }}
        with:
          script: |
            const rows = process.env.CROSSCHECK_BODY;
            const body = `**Fidelity test (crosscheck)**\n${rows}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

