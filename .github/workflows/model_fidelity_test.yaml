name: "fidelity test"


on:
  pull_request:
    branches:
        - "main"

permissions:
  pull-requests: write
  contents: write

jobs:
  crosscheck:
    runs-on: "ubuntu-22.04"
    defaults:
      run:
        working-directory: weir
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ocaml:
              - 'weir/**'
      - if: steps.filter.outputs.ocaml == 'true'
        uses: ocaml/setup-ocaml@v3.7.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
      - if: steps.filter.outputs.ocaml == 'true'
        run: opam install . --deps-only --with-test
      - if: steps.filter.outputs.ocaml == 'true'
        run: opam exec -- dune build
      - if: steps.filter.outputs.ocaml == 'true'
        id: crosscheck
        run: |
          n=$(opam exec -- dune exec reference/bin/crosscheck_run.exe -- engine/bench/test_plans/small_enterprise/plan.json \
            | tail -1 | grep -oE '[0-9]+ disagree' | grep -oE '^[0-9]+')
          baseline=$(grep -v '^#' reference/crosscheck_baseline.txt | tr -d '[:space:]')
          echo "disagreements: $n (baseline: $baseline)"
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt "$baseline" ]; then
            echo "::error::crosscheck regressed: $n disagreements, baseline is $baseline"
            exit 1
          else
            echo "::info::crosscheck within baseline ($n <= $baseline)"
          fi
      - if: steps.filter.outputs.ocaml == 'true' && steps.crosscheck.outputs.n < steps.crosscheck.outputs.baseline
        run: |
          n="${{ steps.crosscheck.outputs.n }}"
          sed -i "3s/.*/$n/" reference/crosscheck_baseline.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reference/crosscheck_baseline.txt
          git commit -m "update crosscheck baseline to $n"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
      - if: always() && steps.filter.outputs.ocaml == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const n = "${{ steps.crosscheck.outputs.n }}";
            const baseline = "${{ steps.crosscheck.outputs.baseline }}";
            const body = `**Fidelity test (crosscheck)**: ${n} disagreement(s) (baseline: ${baseline})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

